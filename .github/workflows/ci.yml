name: CI

# CI runs only on pull requests. Every commit to main must arrive through a
# PR, enforced by the repository branch protection rule
# ("Require a pull request before merging" + "Do not allow bypassing the
# above"). That removes the duplicate push(main) run after a merge while
# keeping direct pushes from landing unverified.
on:
  pull_request:

permissions:
  contents: read

jobs:
  required:
    name: required
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.0.0 --repo FelixJI/vibeocr-protocol --pattern "*.whl" --dir .feed
          gh release download v0.7.0 --repo FelixJI/vibeocr-backend --pattern "vibeocr_backend-*.whl" --dir .feed
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pytest-qt --find-links .feed ./apps/vibeocr-pyside
          python -m pytest
          ./scripts/build-release.ps1
