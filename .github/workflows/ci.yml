name: CI

# CI runs only on pull requests. Every commit to main must arrive through a
# PR, enforced by the repository branch protection rule
# ("Require a pull request before merging" + "Do not allow bypassing the
# above"). That removes the duplicate push(main) run after a merge while
# keeping direct pushes from landing unverified.
on:
  pull_request:

permissions:
  contents: read

jobs:
  required:
    name: required
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/resolve_component_releases.py --policy component-policy.json --output-root .release-input
          if ($LASTEXITCODE -ne 0) { throw 'compatible component resolution failed' }
          Get-ChildItem .release-input/protocol, .release-input/backend -Filter '*.whl' | ForEach-Object {
            $repository = if ($_.Directory.Name -eq 'protocol') { 'FelixJI/vibeocr-protocol' } else { 'FelixJI/vibeocr-backend' }
            gh attestation verify $_.FullName --repo $repository
            if ($LASTEXITCODE -ne 0) { throw "attestation failed: $($_.Name)" }
          }
          $componentLock = Get-Content .release-input/component-lock.json -Raw | ConvertFrom-Json
          $constraints = '.release-input/resolved-components.txt'
          @(
            "vibeocr-backend==$($componentLock.backend.version)"
            "vibeocr-runtime-contracts==$($componentLock.protocol.version)"
            "vibeocr-runtime-client==$($componentLock.protocol.version)"
          ) | Set-Content $constraints -Encoding utf8
          $resolvedWheels = @(
            Get-ChildItem .release-input/protocol -Filter '*.whl'
            Get-ChildItem .release-input/backend -Filter 'vibeocr_backend-*.whl'
          ) | ForEach-Object FullName
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install @resolvedWheels
          if ($LASTEXITCODE -ne 0) { throw 'resolved wheel install failed' }
          python -m pip install -c $constraints pytest pytest-asyncio pytest-qt ./apps/vibeocr-pyside
          if ($LASTEXITCODE -ne 0) { throw 'Classic test dependency install failed' }
          python -m pytest
          if ($LASTEXITCODE -ne 0) { throw 'Classic tests failed' }
          ./scripts/build-release.ps1 -ReleaseInput (Resolve-Path .release-input).Path
