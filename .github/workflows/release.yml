name: Build Release Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft Release tag, for example v0.7.3
        required: true
        type: string
  # Auto-attach assets after the Release Please workflow finishes. Release Please
  # also runs for the non-draft scenario (workflow_dispatch opens the Release
  # PR), so the build job resolves the latest actionable draft and skips
  # gracefully when there is none — see the "Resolve release tag" step.
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # workflow_run events have empty inputs; auto-triggered builds serialize while
  # --clobber keeps retries self-healing for partially populated drafts.
  group: release-assets-${{ github.repository }}-${{ inputs.release_tag || 'auto' }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    name: Build and upload Windows package
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # ref resolved per-event in the next step; default checkout keeps
          # workflow_run (which has no ref context) from failing here.
      - name: Resolve release tag
        id: resolve
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          function Set-ReleaseTargetCheckout {
            param([string] $ReleaseTag)

            # Draft releases do not create their Git tag until publication.
            # Build the exact target commit while retaining tagName as the
            # release/version identifier used by the remaining steps.
            $target = (gh release view $ReleaseTag --json targetCommitish --jq '.targetCommitish').Trim()
            if ([string]::IsNullOrEmpty($target)) {
              throw "Release $ReleaseTag has no target commitish"
            }
            git fetch origin "$target" --force
            git checkout --detach FETCH_HEAD
          }

          # Manual dispatch: resolve the provided draft Release target.
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $tag = $env:INPUT_TAG.Trim()
            if ([string]::IsNullOrEmpty($tag)) { throw "workflow_dispatch requires release_tag input" }
            Set-ReleaseTargetCheckout $tag
            "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
            "release_tag=$tag" >> $env:GITHUB_OUTPUT
            Write-Host "::notice::Manual build for $tag"
            return
          }

          # Auto path (workflow_run): find the latest draft release. The tag
          # pattern tolerates prerelease suffixes (e.g. v0.1.0-preview.2).
          $drafts = gh release list --limit 50 --json tagName,isDraft `
            | ConvertFrom-Json | Where-Object { $_.isDraft -and $_.tagName -match '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$' }
          if (-not $drafts) {
            Write-Host "::notice::No actionable draft release; skipping build."
            "RELEASE_TAG=" >> $env:GITHUB_ENV
            "release_tag=" >> $env:GITHUB_OUTPUT
            return
          }
          $tag = $drafts[0].tagName
          Set-ReleaseTargetCheckout $tag
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "::notice::Auto build for draft $tag"
      - uses: actions/setup-python@v5
        if: env.RELEASE_TAG != ''
        with:
          python-version: "3.13"
      - name: Verify tag and draft Release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $version = (python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('apps/vibeocr-pyside/pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match repository version v$version"
          }
          $isDraft = (gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft').Trim()
          if ($isDraft -ne "true") {
            throw "Release $env:RELEASE_TAG must exist and remain a draft before assets are uploaded"
          }
      - name: Resolve compatible components
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: python scripts/resolve_component_releases.py --policy component-policy.json --output-root .release-input
      - name: Test resolved components
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          Get-ChildItem .release-input/protocol, .release-input/backend -Filter '*.whl' | ForEach-Object {
            $repository = if ($_.Directory.Name -eq 'protocol') { 'FelixJI/vibeocr-protocol' } else { 'FelixJI/vibeocr-backend' }
            gh attestation verify $_.FullName --repo $repository
            if ($LASTEXITCODE -ne 0) { throw "attestation failed: $($_.Name)" }
          }
          $componentLock = Get-Content .release-input/component-lock.json -Raw | ConvertFrom-Json
          $constraints = '.release-input/resolved-components.txt'
          @(
            "vibeocr-backend==$($componentLock.backend.version)"
            "vibeocr-runtime-contracts==$($componentLock.protocol.version)"
            "vibeocr-runtime-client==$($componentLock.protocol.version)"
          ) | Set-Content $constraints -Encoding utf8
          $resolvedWheels = @(
            Get-ChildItem .release-input/protocol -Filter '*.whl'
            Get-ChildItem .release-input/backend -Filter 'vibeocr_backend-*.whl'
          ) | ForEach-Object FullName
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install @resolvedWheels
          if ($LASTEXITCODE -ne 0) { throw 'resolved wheel install failed' }
          python -m pip install -c $constraints pytest pytest-asyncio pytest-qt ./apps/vibeocr-pyside
          if ($LASTEXITCODE -ne 0) { throw 'Classic test dependency install failed' }
          python -m pytest
          if ($LASTEXITCODE -ne 0) { throw 'Classic tests failed' }
      - name: Build release assets
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version '${{ env.RELEASE_TAG }}' -ReleaseInput (Resolve-Path .release-input).Path
      - name: Verify release candidate assets
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          python scripts/verify_release_assets.py artifacts `
            --require SBOM.spdx.json `
            --require-one 'VibeOCR-Classic-v*-win64.zip' `
            --require-one 'VibeOCR-Classic-v*-win64.zip.sha256'
      - name: Upload release candidate artifact
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/attest@v4
        if: env.RELEASE_TAG != ''
        with:
          subject-checksums: artifacts/SHA256SUMS
      - uses: actions/attest@v4
        if: env.RELEASE_TAG != ''
        with:
          subject-checksums: artifacts/SHA256SUMS
          sbom-path: artifacts/SBOM.spdx.json
      - name: Attach assets to draft Release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $zipName = "VibeOCR-Classic-$env:RELEASE_TAG-win64.zip"
          $expected = @($zipName, "$zipName.sha256", 'SHA256SUMS', 'SBOM.spdx.json')
          $uploaded = @(gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name')
          $obsolete = @($uploaded | Where-Object { $_ -notin $expected })
          foreach ($asset in $obsolete) {
            gh release delete-asset $env:RELEASE_TAG $asset --yes
            if ($LASTEXITCODE -ne 0) { throw "failed to delete obsolete asset: $asset" }
          }
          $publicAssets = @(
            (Resolve-Path "artifacts/$zipName").Path
            (Resolve-Path "artifacts/$zipName.sha256").Path
            (Resolve-Path 'artifacts/SHA256SUMS').Path
            (Resolve-Path 'artifacts/SBOM.spdx.json').Path
          )
          gh release upload $env:RELEASE_TAG @publicAssets --clobber
      - name: Verify uploaded Release assets
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $zipName = "VibeOCR-Classic-$env:RELEASE_TAG-win64.zip"
          $expected = @($zipName, "$zipName.sha256", 'SHA256SUMS', 'SBOM.spdx.json')
          $uploaded = @(gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name')
          $missing = @($expected | Where-Object { $_ -notin $uploaded })
          $unexpected = @($uploaded | Where-Object { $_ -notin $expected })
          if ($missing.Count -ne 0 -or $unexpected.Count -ne 0) {
            throw "Release asset set mismatch; missing=$($missing -join ', '); unexpected=$($unexpected -join ', ')"
          }
      - name: Publish verified Release
        if: env.RELEASE_TAG != '' && github.event_name == 'workflow_run'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: gh release edit $env:RELEASE_TAG --draft=false
