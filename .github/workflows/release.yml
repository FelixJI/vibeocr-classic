name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
        if: hashFiles('global.json') != ''
      - name: Verify immutable tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('apps/vibeocr-pyside/pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          if ($env:RELEASE_TAG -ne "v$version") { exit 1 }
      - name: Build release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/build-release.ps1 -Version $env:RELEASE_TAG
      - uses: actions/attest@v4
        with:
          subject-checksums: artifacts/SHA256SUMS
      - uses: actions/attest@v4
        with:
          subject-checksums: artifacts/SHA256SUMS
          sbom-path: artifacts/SBOM.spdx.json
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG artifacts/* --verify-tag --generate-notes
