[project]
name = "vibeocr-backend"
version = "0.15.1"
description = "UI-free VibeOCR inference Supervisor runtime"
requires-python = ">=3.13,<3.14"
dependencies = [
    "vibeocr-runtime-contracts>=2.9.0,<3.0.0",
    "pillow>=12.3.0",
    "numpy>=2.3.5",
    "httpx>=0.28.1",
    "jsonschema>=4.25.0",
    "pymupdf>=1.28.0",
    "pydantic>=2.13.4",
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
    "fonttools>=4.63.0",
    "markdown>=3.10.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "qrcode[pil]>=8.2",
    "python-barcode>=0.16.1",
    "pyzbar>=0.1.9",
    "pynvml>=11.5.0",
    "packaging>=26.0",
    "python-multipart>=0.0.32",
]

# 引擎环境（MinerU CPU/GPU、Paddle CPU/GPU）不作为本包 extras 分发：
# 桌面端按 runtime-profiles/ 下的带哈希锁清单用 uv 创建独立环境安装。
# GPU 版 paddle/torch wheel 不在默认包索引，extras 声明会破坏 workspace 解析。

[project.scripts]
vibeocr-supervisor = "vibeocr.backend.supervisor.main:main"
vibeocr-runtime-installer = "vibeocr.backend.runtime_installer:main"

[tool.uv.sources]
vibeocr-runtime-contracts = { url = "https://github.com/FelixJI/vibeocr-protocol/releases/download/v2.9.0/vibeocr_runtime_contracts-2.9.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibeocr"]

[tool.hatch.build.targets.wheel.force-include]
"src/vibeocr/backend/dependency_profiles.json" = "vibeocr/backend/dependency_profiles.json"
# 引擎环境的依赖清单（uv 按此创建 Paddle/MinerU 独立环境）随包分发，
# 桌面端与独立安装两种形态都能定位到同一份清单。
"runtime-profiles" = "vibeocr/backend/runtime-profiles"
