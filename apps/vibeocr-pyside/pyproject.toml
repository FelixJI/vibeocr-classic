[project]
name = "vibeocr-classic"
version = "0.9.0"
description = "VibeOCR PySide6 Classic desktop shell"
requires-python = ">=3.13,<3.14"
dependencies = [
    "vibeocr-runtime-contracts>=2.4.0,<3.0.0",
    "vibeocr-runtime-client>=2.4.0,<3.0.0",
    "vibeocr-backend",
    "pyside6>=6.11.1",
    "qasync>=0.28.0",
    "numpy>=2.3.5",
]

[project.scripts]
vibeocr = "vibeocr.classic.main:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibeocr"]
